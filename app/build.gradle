plugins {
    id 'com.android.application'
}

android {
    namespace 'net.kg7lbj.h9monitor'
    compileSdk 34

    defaultConfig {
        applicationId 'net.kg7lbj.h9monitor'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // Release signing comes from environment variables (see README):
    // H9_KEYSTORE (path), H9_KEYSTORE_PASSWORD, H9_KEY_ALIAS, H9_KEY_PASSWORD.
    // Without them the release build is signed with the debug key.
    signingConfigs {
        own {
            def ks = System.getenv('H9_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('H9_KEYSTORE_PASSWORD')
                keyAlias System.getenv('H9_KEY_ALIAS')
                keyPassword System.getenv('H9_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('H9_KEYSTORE') ? signingConfigs.own : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// No libraries: the app uses only the Android framework.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
